name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild weekly so the street data picks up OpenStreetMap edits.
  schedule:
    - cron: '17 5 * * 1'

# Least privilege: read-only by default; only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Builds the site, including street data for the regions in
  # scripts/regions.json. Runs on pull requests too, so a broken data build
  # shows up before merging.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium
      - name: Download OpenStreetMap extracts
        run: |
          mkdir -p "$RUNNER_TEMP/osm"
          python3 - <<'PY'
          import json, os, subprocess
          for region in json.load(open('scripts/regions.json'))['regions']:
              out = os.path.join(os.environ['RUNNER_TEMP'], 'osm', region['url'].rsplit('/', 1)[1])
              subprocess.run(['curl', '-sSfL', '--retry', '5', '--retry-delay', '30', '-o', out, region['url']], check=True)
          PY
      - name: Build street data
        run: python3 scripts/build_streets.py data/streets "$RUNNER_TEMP"/osm/*.osm.pbf
      - name: Check the street data
        run: |
          python3 - <<'PY'
          import json
          index = json.load(open('data/streets/index.json'))
          assert index['regions'] and len(index['tiles']) > 50, index['regions']
          print(len(index['tiles']), 'tiles,', len(index['places']), 'places')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
