name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Rebuild weekly so the street data picks up OpenStreetMap edits.
  schedule:
    - cron: '17 5 * * 1'

# Least privilege: read-only by default; only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Builds the site, including street data for the regions in
  # scripts/regions.json. Runs on pull requests too, so a broken data build
  # shows up before merging.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium
      # Last good download, so a download site being down never blocks a deploy.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/osm
          key: osm-${{ hashFiles('scripts/regions.json') }}-${{ github.run_id }}
          restore-keys: |
            osm-${{ hashFiles('scripts/regions.json') }}-
            osm-
      - name: Download OpenStreetMap extracts
        id: download
        run: python3 scripts/download_extracts.py scripts/regions.json "$RUNNER_TEMP/osm"
      - if: steps.download.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/osm
          key: osm-${{ hashFiles('scripts/regions.json') }}-${{ github.run_id }}
      - name: Build street data
        run: |
          if python3 scripts/build_streets.py data/streets scripts/regions.json "$RUNNER_TEMP/osm"; then
            echo "Built $(ls data/streets | wc -l) street files" >> "$GITHUB_STEP_SUMMARY"
          else
            rm -rf data/streets
            echo "::warning::No street data was built. The app will use the public street servers until the next build."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
