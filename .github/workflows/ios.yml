name: iPhone app

# Builds the iPhone app on one of GitHub's Macs (unsigned, for the simulator),
# so mistakes show up here instead of on the Mac used to install it.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'js/**', 'css/**', 'icons/**', 'index.html', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'js/**', 'css/**', 'icons/**', 'index.html', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project ios/WalkTracker.xcodeproj -target WalkTracker -configuration Debug \
            -sdk iphonesimulator SYMROOT="$PWD/ios-build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60
      - name: Check the web app is built in
        run: |
          APP=ios-build/Debug-iphonesimulator/WalkTracker.app
          ls "$APP"
          test -f "$APP/web/index.html" && test -f "$APP/web/js/app.js" && test -f "$APP/web/js/native.js"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist"
      - name: Launch in the iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" ios-build/Debug-iphonesimulator/WalkTracker.app
          xcrun simctl launch "$UDID" io.github.kwang2424.walktracker
          sleep 25
          # Still running (didn't crash on launch)?
          xcrun simctl spawn "$UDID" launchctl list | grep -q io.github.kwang2424.walktracker
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/launch.png"
          sips -Z 700 -s format jpeg "$RUNNER_TEMP/launch.png" --out "$RUNNER_TEMP/launch.jpg" > /dev/null
          # Printed so the result can be checked straight from the log.
          echo "SCREENSHOT_BEGIN"; base64 -i "$RUNNER_TEMP/launch.jpg"; echo "SCREENSHOT_END"
